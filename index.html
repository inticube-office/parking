<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#D92B26">
<title>주차 할인권 등록 | INTICUBE</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --amber:  #F2B100;
    --orange: #E87D18;
    --red:    #D92B26;
    --ink:    #15171C;
    --sub:    #6B7280;
    --line:   #E3E6EB;
    --mist:   #F6F7F9;
    --ok-bg:  #EAF6EE;  --ok-fg: #146C3A;
    --ng-bg:  #FDECEA;  --ng-fg: #B3261E;
    --wait-bg:#F6F7F9;  --wait-fg:#4B5563;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { background: var(--mist); }

  body {
    margin: 0;
    font-family: "Pretendard Variable", Pretendard, -apple-system,
                 "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 440px; margin: 0 auto; min-height: 100vh; background: #fff; }

  /* ---------- 헤더 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px 16px;
    border-bottom: 1px solid var(--line);
  }
  .topbar img { height: 26px; width: auto; display: block; }
  .topbar .fallback { font-weight: 800; letter-spacing: .14em; font-size: 15px; }
  .topbar .divider { width: 1px; height: 18px; background: var(--line); }
  .topbar .sysname { font-size: 14px; font-weight: 600; color: var(--sub); letter-spacing: -.01em; }

  /* ---------- 단계 표시 (CI 모자이크 모티프) ---------- */
  .steps { display: flex; gap: 0; padding: 18px 20px 4px; }
  .steps .item { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .steps .bar { height: 5px; border-radius: 2px; background: var(--line); margin-right: 4px; }
  .steps .item:last-child .bar { margin-right: 0; }
  .steps .item[data-on="1"]:nth-child(1) .bar { background: var(--amber); }
  .steps .item[data-on="1"]:nth-child(2) .bar { background: var(--orange); }
  .steps .item[data-on="1"]:nth-child(3) .bar { background: var(--red); }
  .steps .lb { font-size: 11.5px; font-weight: 600; color: #B4B9C2; letter-spacing: .01em; }
  .steps .item[data-on="1"] .lb { color: var(--ink); }

  main { padding: 22px 20px 40px; }

  h1 { font-size: 21px; font-weight: 800; letter-spacing: -.03em; margin: 0 0 5px; }
  .lede { font-size: 13.5px; color: var(--sub); margin: 0 0 22px; }

  /* ---------- 폼 ---------- */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; letter-spacing: -.01em; }
  .field .hint { font-size: 12px; color: var(--sub); font-weight: 500; margin-left: 6px; }

  input, select {
    width: 100%; height: 52px; padding: 0 14px;
    font: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1.5px solid var(--line); border-radius: 10px;
    transition: border-color .15s;
  }
  input::placeholder { color: #AFB4BD; }
  input:focus, select:focus { outline: none; border-color: var(--ink); }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  select { appearance: none; background-image:
    linear-gradient(45deg, transparent 50%, var(--sub) 50%),
    linear-gradient(135deg, var(--sub) 50%, transparent 50%);
    background-position: calc(100% - 20px) 23px, calc(100% - 15px) 23px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

  #plateInput { font-size: 22px; font-weight: 800; letter-spacing: .12em;
                text-align: center; font-variant-numeric: tabular-nums; }

  /* ---------- 버튼 ---------- */
  .btn {
    width: 100%; height: 54px; border: 0; border-radius: 10px;
    font: inherit; font-size: 16px; font-weight: 700; letter-spacing: -.01em;
    cursor: pointer; margin-top: 8px;
  }
  .btn-main { background: var(--red); color: #fff; }
  .btn-main:active { background: #BE231F; }
  .btn-main:disabled { background: #CBD0D8; cursor: default; }
  .btn-ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .btn:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  /* ---------- 상태 메시지 ---------- */
  .msg { margin-top: 18px; padding: 14px 16px; border-radius: 10px;
         font-size: 14px; font-weight: 500; line-height: 1.45; }
  .msg.ok   { background: var(--ok-bg);   color: var(--ok-fg); }
  .msg.ng   { background: var(--ng-bg);   color: var(--ng-fg); }
  .msg.wait { background: var(--wait-bg); color: var(--wait-fg);
              display: flex; align-items: center; gap: 12px; }

  /* 로딩: CI 모자이크가 순차로 채워짐 */
  .dots { display: flex; gap: 5px; flex: none; }
  .dots i { width: 9px; height: 9px; border-radius: 3px; background: #D6DAE1; }
  @media (prefers-reduced-motion: no-preference) {
    .dots i { animation: fill 1.2s infinite; }
    .dots i:nth-child(1) { animation-delay: 0s;    }
    .dots i:nth-child(2) { animation-delay: .15s;  }
    .dots i:nth-child(3) { animation-delay: .3s;   }
    .dots i:nth-child(4) { animation-delay: .45s;  }
    @keyframes fill {
      0%, 70%, 100% { background: #D6DAE1; }
      20%           { background: var(--amber); }
      35%           { background: var(--orange); }
      50%           { background: var(--red); }
    }
  }
  .elapsed { font-variant-numeric: tabular-nums; color: #9AA0AA; font-size: 13px; }

  /* ---------- 차량 목록 ---------- */
  .listhead { font-size: 13px; font-weight: 700; margin: 24px 0 10px; }
  .car {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 15px 16px; margin-bottom: 10px; font: inherit;
  }
  .car:hover { border-color: var(--orange); }
  .car:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .car .pl { font-size: 19px; font-weight: 800; letter-spacing: -.01em;
             font-variant-numeric: tabular-nums; }
  .car .mt { font-size: 12.5px; color: var(--sub); margin-top: 5px; }
  .car .wn { font-size: 12.5px; color: #A85B00; font-weight: 600; margin-top: 5px; }

  /* ---------- 선택 차량 카드 (번호판 모티프) ---------- */
  .plate {
    border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden;
    margin-bottom: 22px;
  }
  .plate .swatch { display: flex; height: 5px; }
  .plate .swatch span { flex: 1; }
  .plate .swatch span:nth-child(1) { background: var(--amber); }
  .plate .swatch span:nth-child(2) { background: var(--orange); }
  .plate .swatch span:nth-child(3) { background: var(--red); }
  .plate .body { padding: 16px; }
  .plate .no { font-size: 27px; font-weight: 800; letter-spacing: -.02em;
               font-variant-numeric: tabular-nums; line-height: 1.15; }
  .plate dl { display: grid; grid-template-columns: 64px 1fr; gap: 5px 0;
              margin: 12px 0 0; font-size: 13px; }
  .plate dt { color: var(--sub); font-weight: 500; }
  .plate dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .plate .flag { margin-top: 11px; font-size: 12.5px; font-weight: 600; color: #A85B00; }

  /* ---------- 완료 화면 ---------- */
  .done { text-align: center; padding: 26px 0 8px; }
  .done .mosaic { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .done .mosaic i { width: 16px; height: 16px; border-radius: 5px; }
  .done .mosaic i:nth-child(1) { background: var(--amber); }
  .done .mosaic i:nth-child(2) { background: var(--orange); }
  .done .mosaic i:nth-child(3) { background: var(--red); }
  .done h2 { font-size: 20px; font-weight: 800; letter-spacing: -.03em; margin: 0 0 8px; }
  .done p { font-size: 14px; color: var(--sub); margin: 0; }
  .done .sum { background: var(--mist); border-radius: 12px; padding: 15px;
               margin: 22px 0 4px; text-align: left; font-size: 13.5px; }
  .done .sum div { display: flex; justify-content: space-between; padding: 3px 0; }
  .done .sum span { color: var(--sub); }
  .done .sum b { font-weight: 700; }

  .hide { display: none !important; }

  footer { padding: 0 20px 30px; font-size: 11.5px; color: #A6ACB6; text-align: center; }
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <img src="logo.jpg" alt="INTICUBE"
         onerror="this.style.display='none';document.getElementById('wm').classList.remove('hide')">
    <span class="fallback hide" id="wm">INTICUBE</span>
    <span class="divider"></span>
    <span class="sysname">주차 할인권 등록</span>
  </header>

  <div class="steps" id="steps">
    <div class="item" data-on="1"><div class="bar"></div><div class="lb">차량 조회</div></div>
    <div class="item"><div class="bar"></div><div class="lb">정보 입력</div></div>
    <div class="item"><div class="bar"></div><div class="lb">등록 완료</div></div>
  </div>

  <main>

    <!-- ===== 1단계 ===== -->
    <section id="view1">
      <h1>차량을 조회하세요</h1>
      <p class="lede">방문객 차량번호 뒤 4자리를 입력하면 입차 기록을 찾습니다.</p>

      <div class="field">
        <label for="searchNo">차량번호 뒤 4자리</label>
        <input type="text" id="searchNo" inputmode="numeric" maxlength="4"
               placeholder="0000" autocomplete="off">
      </div>

      <button class="btn btn-main" id="btnSearch">조회</button>
      <div id="msg1" class="msg hide" aria-live="polite"></div>

      <div id="listWrap" class="hide">
        <div class="listhead" id="listHead"></div>
        <div id="carlist"></div>
      </div>
    </section>

    <!-- ===== 2단계 ===== -->
    <section id="view2" class="hide">
      <h1>등록 정보를 입력하세요</h1>
      <p class="lede">사번으로 등록자를 인증하며, 등록 이력이 함께 기록됩니다.</p>

      <div class="plate">
        <div class="swatch"><span></span><span></span><span></span></div>
        <div class="body">
          <div class="no" id="pNo"></div>
          <dl>
            <dt>주차시간</dt><dd id="pPark"></dd>
            <dt>입차시간</dt><dd id="pEntry"></dd>
          </dl>
          <div class="flag hide" id="pFlag"></div>
        </div>
      </div>

      <div class="field">
        <label for="empId">사번</label>
        <input type="text" id="empId" inputmode="numeric" maxlength="6"
               placeholder="숫자 6자리" autocomplete="off">
      </div>

      <div class="field">
        <label for="company">방문업체명</label>
        <input type="text" id="company" maxlength="30" placeholder="예: OO솔루션즈" autocomplete="off">
      </div>

      <div class="field">
        <label for="discountType">할인 유형</label>
        <select id="discountType">
          <option value="">선택하세요</option>
          <option value="1">30분</option>
          <option value="2">1시간</option>
          <option value="3">2시간</option>
          <option value="4">일일권</option>                    
        </select>
      </div>
      <p class="lede" style="margin:4px 0; line-height:1.3;">
  📢 방문객 주차 할인권은 최대 2시간만 등록할 수 있습니다.
</p>
<p class="lede" style="margin:4px 0; line-height:1.3;">
  💠 주차 할인권 사용량은 매월 모니터링되고 있습니다.
</p>

      <button class="btn btn-main" id="btnRegister">할인권 등록</button>
      <button class="btn btn-ghost" id="btnBack">다시 조회</button>
      <div id="msg2" class="msg hide" aria-live="polite"></div>
    </section>

    <!-- ===== 3단계 ===== -->
    <section id="view3" class="hide">
      <div class="done">
        <div class="mosaic"><i></i><i></i><i></i></div>
        <h2>등록이 완료되었습니다</h2>
        <p>주차 시스템에 할인이 적용되었습니다.</p>
        <div class="sum" id="doneSum"></div>
      </div>
      <button class="btn btn-main" id="btnNext">다음 차량 등록</button>
    </section>

  </main>

  <footer>INTICUBE · 누리꿈스퀘어 방문객 주차 할인권</footer>
</div>

<script>
  const $ = id => document.getElementById(id);
  let searchedNo = '';
  let selectedCar = null;
  let timer = null;

  function setStep(n) {
    [...$('steps').children].forEach((el, i) => {
      if (i < n) el.setAttribute('data-on', '1');
      else el.removeAttribute('data-on');
    });
  }

  function showMsg(el, cls, text) {
    if (cls === 'wait') {
      el.className = 'msg wait';
      el.innerHTML = '<span class="dots"><i></i><i></i><i></i><i></i></span>' +
                     '<span>' + text + ' <span class="elapsed" id="el_' + el.id + '">0초</span></span>';
      let s = 0;
      clearInterval(timer);
      timer = setInterval(() => {
        s++;
        const t = $('el_' + el.id);
        if (t) t.textContent = s + '초';
      }, 1000);
    } else {
      clearInterval(timer);
      el.className = 'msg ' + cls;
      el.textContent = text;
    }
  }

  function hideMsg(el) { clearInterval(timer); el.className = 'msg hide'; }

  function toStep1() {
    $('view2').classList.add('hide');
    $('view3').classList.add('hide');
    $('view1').classList.remove('hide');
    $('listWrap').classList.add('hide');
    $('carlist').innerHTML = '';
    hideMsg($('msg1'));
    hideMsg($('msg2'));
    selectedCar = null;
    setStep(1);
    window.scrollTo(0, 0);
  }

  // ---------- 1단계: 조회 ----------
  $('btnSearch').addEventListener('click', async () => {
    const no = $('searchNo').value.trim();
    $('listWrap').classList.add('hide');
    $('carlist').innerHTML = '';
    $('btnSearch').disabled = true;
    showMsg($('msg1'), 'wait', '입차 기록을 찾고 있습니다.');

    try {
      const res = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ carNo: no })
      });
      const data = await res.json();

      if (!data.ok) { showMsg($('msg1'), 'ng', data.message); return; }

      searchedNo = no;
      hideMsg($('msg1'));

      if (data.cars.length === 1) { pickCar(data.cars[0]); return; }

      $('listHead').textContent = data.cars.length + '대가 조회되었습니다. 차량을 선택하세요.';
      $('listWrap').classList.remove('hide');

      data.cars.forEach(c => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'car';
        b.innerHTML =
          '<div class="pl">' + c.carNo + '</div>' +
          '<div class="mt">입차 ' + c.entryTime + ' · 주차 ' + c.parkTime + '</div>' +
          (c.dscntCnt > 0 ? '<div class="wn">이미 할인 ' + c.dscntCnt + '건 등록됨</div>' : '');
        b.addEventListener('click', () => pickCar(c));
        $('carlist').appendChild(b);
      });
    } catch (err) {
      showMsg($('msg1'), 'ng', '서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.');
    } finally {
      $('btnSearch').disabled = false;
    }
  });

  $('searchNo').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('btnSearch').click();
  });

  // ---------- 차량 선택 ----------
  function pickCar(car) {
    selectedCar = car;
    $('pNo').textContent = car.carNo;
    $('pPark').textContent = car.parkTime;
    $('pEntry').textContent = car.entryTime;

    if (car.dscntCnt > 0) {
      $('pFlag').textContent = '이미 할인 ' + car.dscntCnt + '건이 등록된 차량입니다.';
      $('pFlag').classList.remove('hide');
    } else {
      $('pFlag').classList.add('hide');
    }

    $('view1').classList.add('hide');
    $('view2').classList.remove('hide');
    hideMsg($('msg2'));
    setStep(2);
    window.scrollTo(0, 0);
    $('empId').focus();
  }

  // ---------- 2단계: 등록 ----------
  $('btnRegister').addEventListener('click', async () => {
    if (!selectedCar) { toStep1(); return; }

    $('btnRegister').disabled = true;
    showMsg($('msg2'), 'wait', '주차 시스템에 등록하고 있습니다.');

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          carNo: searchedNo,
          carId: selectedCar.id,
          empId: $('empId').value.trim(),
          company: $('company').value.trim(),
          discountType: $('discountType').value
        })
      });
      const data = await res.json();

      if (!data.ok) { showMsg($('msg2'), 'ng', data.message); return; }

      hideMsg($('msg2'));
      const typeLabel = $('discountType').selectedOptions[0].textContent;
      $('doneSum').innerHTML =
        '<div><span>차량번호</span><b>' + selectedCar.carNo + '</b></div>' +
        '<div><span>할인 유형</span><b>' + typeLabel + '</b></div>' +
        '<div><span>방문업체</span><b>' + $('company').value.trim() + '</b></div>';

      $('view2').classList.add('hide');
      $('view3').classList.remove('hide');
      setStep(3);
      window.scrollTo(0, 0);
    } catch (err) {
      showMsg($('msg2'), 'ng', '서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.');
    } finally {
      $('btnRegister').disabled = false;
    }
  });

  $('btnBack').addEventListener('click', () => { $('searchNo').value = ''; toStep1(); });

  $('btnNext').addEventListener('click', () => {
    $('searchNo').value = '';
    $('company').value = '';
    $('discountType').value = '';
    toStep1();
    $('searchNo').focus();
  });
</script>
</body>
</html>
