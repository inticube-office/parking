<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>등록 이력 조회</title>
  <style>
    body { font-family: -apple-system, "Malgun Gothic", sans-serif; padding: 20px; }
    h1 { font-size: 20px; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; font-size: 14px; white-space: nowrap; }
    th { background: #f3f3f3; }
  </style>
</head>
<body>
  <h1>등록 이력</h1>
  <p id="count"></p>
  <table>
    <thead>
      <tr>
        <th>일시</th><th>사번</th><th>이름</th><th>부서</th>
        <th>방문업체</th><th>차량번호</th><th>할인</th><th>결과</th><th>비고 전송값</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    (async () => {
      const res = await fetch('/api/logs');
      const logs = await res.json();

      document.getElementById('count').textContent = `총 ${logs.length}건`;
      document.getElementById('rows').innerHTML = logs.map(r => `
        <tr>
          <td>${r.date || ''}</td><td>${r.empId || ''}</td><td>${r.name || ''}</td>
          <td>${r.dept || ''}</td><td>${r.company || ''}</td><td>${r.carNo || ''}</td>
          <td>${r.type || ''}</td><td>${r.result || ''}</td><td>${r.memo || ''}</td>
        </tr>
      `).join('');
    })();
  </script>
</body>
</html>
